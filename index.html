<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتب مصرية - المكتبة الشاملة والذكية</title>
    
    <!-- كود إعلانات Monetag Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Egypt-Books/sw.js')
            .then(function(reg) {
                console.log('Service Worker Active!', reg);
            }).catch(function(err) {
                console.log('Service Worker Failed: ', err);
            });
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        header {
            background: linear-gradient(135deg, #0077b6, #0096c7);
            color: white;
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.2);
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        header p {
            margin: 0;
            opacity: 0.95;
            font-size: 16px;
        }
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        select {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #0096c7;
            outline: none;
            background-color: white;
            color: #0077b6;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }
        /* أزرار مسارات تانية ثانوي */
        .paths-container {
            display: none;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .path-btn {
            background-color: #ade8f4;
            color: #03045e;
            border: 2px solid #0077b6;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .path-btn:hover, .path-btn.active {
            background-color: #0077b6;
            color: white;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .book-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 280px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 4px solid #0077b6;
            transition: transform 0.2s;
        }
        .book-card:hover {
            transform: translateY(-5px);
        }
        .book-card h3 {
            margin-top: 0;
            color: #0077b6;
            font-size: 18px;
        }
        .book-card p {
            font-size: 13px;
            color: #555;
            margin: 5px 0 15px 0;
            background: #e0fbfc;
            padding: 5px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .download-btn {
            display: block;
            background: #2a9d8f;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background: #21867a;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            color: #666;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

        <p>جميع أنواع الكتب والمناهج ومسارات البكالوريا الحديثة بروابط تحميل مباشر</p>

    <div class="filter-section">

            <option value="prep1">الصف الأول الإعدادي</option>
            <option value="prep2">الصف الثاني الإعدادي</option>
            <option value="prep3">الصف الثالث الإعدادي</option>
            <option value="sec1">الصف الأول الثانوي</option>
            <option value="sec2">الصف الثاني الثانوي (نظام المسارات الحديث)</option>
            <option value="sec3">الصف الثالث الثانوي</option>
        </select>
    </div>

    <!-- مسارات الصف الثاني الثانوي -->

        <button class="path-btn" onclick="filterSec2Path('eng')">مسار الهندسة وعلوم الحاسب</button>

        <button class="path-btn" onclick="filterSec2Path('business')">مسار الأعمال والذكاء الاصطناعي</button>
        <button class="path-btn" onclick="filterSec2Path('arts')">مسار الآداب والعلوم الإنسانية</button>
    </div>

    <div class="container" id="booksList">
        <!-- الكتب ستعرض هنا تلقائياً -->
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © كتب مصرية 2026</p>
    </footer>

        let currentStage = 'all';
        let currentSec2Path = 'all';

        function displayBooks(books) {
            const container = document.getElementById('booksList');
            container.innerHTML = '';
            
            if (books.length === 0) {
                container.innerHTML = '<p style="color: #666; font-size: 18px;">لا توجد كتب مضافة لهذا الاختيار حالياً.</p>';
                return;
            }

            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div>
                        <h3>${book.title}</h3>
                        <p>${book.pathName}</p>
                    </div>
                    <a href="${book.url}" class="download-btn" download target="_blank">تحميل ملف PDF مباشرة</a>
                `;
                container.appendChild(card);
            });
        }

        function handleStageChange() {
            currentStage = document.getElementById('stageFilter').value;
            const pathsContainer = document.getElementById('sec2Paths');

            // إظهار أزرار المسارات فقط لو اختار الصف الثاني الثانوي
            if (currentStage === 'sec2') {
                pathsContainer.style.display = 'flex';
                filterSec2Path('all');
            } else {
                pathsContainer.style.display = 'none';
                if (currentStage === 'all') {
                    displayBooks(allBooks);
                } else {
                    const filtered = allBooks.filter(b => b.stage === currentStage);
                    displayBooks(filtered);
                }
            }
        }

        function filterSec2Path(pathKey) {
            currentSec2Path = pathKey;
            
            // تحديث تصميم الأزرار النشطة
            const buttons = document.querySelectorAll('.path-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event && event.target.classList.add('active');

            const sec2Books = allBooks.filter(b => b.stage === 'sec2');
            if (pathKey === 'all') {
                displayBooks(sec2Books);
            } else {
                const filtered = sec2Books.filter(b => b.path === pathKey);
                displayBooks(filtered);
            }
        }

        // العرض التلقائي الأولي لكل الكتب
        displayBooks(allBooks);
    </script>
</body>
</html>
