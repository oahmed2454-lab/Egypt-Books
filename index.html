<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة المدرسية الإلكترونية - الكتب والمناهج المصرية</title>
    
    <!-- كود تفعيل وتوصيل إعلانات Monetag Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Egypt-Books/sw.js')
            .then(function(reg) {
                console.log('Monetag Service Worker Registered Successfully!', reg);
            }).catch(function(err) {
                console.log('Service Worker Registration Failed: ', err);
            });
        }
    </script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        select, input {
            padding: 12px 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            border-color: #2a5298;
        }

        input {
            width: 100%;
            max-width: 350px;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .book-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .book-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .book-info {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        .download-btn {
            display: block;
            text-align: center;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .download-btn:hover {
            background-color: #219150;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #777;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 كتب مصرية - المكتبة المدرسية الإلكترونية</h1>
        <p>جميع المناهج والكتب الدراسية بروابط مباشرة مجاناً</p>
    </header>

    <div class="controls">
        <select id="gradeFilter">
            <option value="all">جميع المراحل الدراسية</option>
            <option value="sec2">الصف الثاني الثانوي</option>
            <option value="sec1">الصف الأول الثانوي</option>
            <option value="prep3">الصف الثالث الإعدادي</option>
        </select>

        <input type="text" id="searchInput" placeholder="ابحث عن اسم المادة أو الكتاب...">
    </div>

    <div class="books-grid" id="booksContainer"></div>

    <footer>
        <p>جميع الحقوق محفوظة © كتب مصرية 2026</p>
    </footer>

    <script>
        const books = [
            { title: "كتاب اللغة العربية", grade: "sec2", subject: "عربي", link: "#" },
            { title: "كتاب الرياضيات (المحاضرات)", grade: "sec2", subject: "رياضيات", link: "#" },
            { title: "كتاب الفيزياء - الصف الثاني الثانوي", grade: "sec2", subject: "فيزياء", link: "#" },
            { title: "كتاب الكيمياء - الصف الثاني الثانوي", grade: "sec2", subject: "كيمياء", link: "#" },
            { title: "كتاب الأحياء - الصف الثاني الثانوي", grade: "sec2", subject: "أحياء", link: "#" },
            { title: "كتاب اللغة الإنجليزية (English)", grade: "sec2", subject: "إنجليزي", link: "#" }
        ];

        const container = document.getElementById('booksContainer');
        const gradeFilter = document.getElementById('gradeFilter');
        const searchInput = document.getElementById('searchInput');

        function renderBooks() {
            const selectedGrade = gradeFilter.value;
            const searchText = searchInput.value.toLowerCase();
            container.innerHTML = '';

            const filteredBooks = books.filter(book => {
                const matchesGrade = selectedGrade === 'all' || book.grade === selectedGrade;
                const matchesSearch = book.title.toLowerCase().includes(searchText) || book.subject.toLowerCase().includes(searchText);
                return matchesGrade && matchesSearch;
            });

            if (filteredBooks.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">لا توجد كتب تطابق البحث.</p>';
                return;
            }

            filteredBooks.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div>
                        <div class="book-title">${book.title}</div>
                        <div class="book-info">المادة: ${book.subject}</div>
                    </div>
                    <a href="${book.link}" class="download-btn" target="_blank">تحميل الكتاب (PDF)</a>
                `;
                container.appendChild(card);
            });
        }

        gradeFilter.addEventListener('change', renderBooks);
        searchInput.addEventListener('input', renderBooks);
        renderBooks();
    </script>
</body>
</html>
