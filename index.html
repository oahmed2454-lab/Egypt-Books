<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتب مصرية - المكتبة الإلكترونية الشاملة</title>
    
    <!-- كود إعلانات Monetag Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Egypt-Books/sw.js')
            .then(function(reg) {
                console.log('Monetag Service Worker Active!', reg);
            }).catch(function(err) {
                console.log('Service Worker Failed: ', err);
            });
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 30px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        header p {
            margin: 0;
            opacity: 0.9;
        }
        .filter-section {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            background-color: white;
            font-family: inherit;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .book-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            width: 260px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .book-card:hover {
            transform: translateY(-4px);
        }
        .book-card h3 {
            margin-top: 0;
            color: #1e3c72;
            font-size: 18px;
        }
        .book-card p {
            font-size: 14px;
            color: #666;
            margin: 5px 0 15px 0;
        }
        .download-btn {
            display: block;
            background: #27ae60;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background: #219653;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            color: #777;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 كتب مصرية - المكتبة الإلكترونية الشاملة</h1>
        <p>جميع المناهج والكتب الدراسية من الصف الأول الإعدادي حتى الثالث الثانوي</p>
    </header>

    <div class="filter-section">
        <select id="stageFilter" onchange="filterBooks()">
            <option value="all">كل المراحل والصفوف</option>
            <option value="prep1">الصف الأول الإعدادي</option>
            <option value="prep2">الصف الثاني الإعدادي</option>
            <option value="prep3">الصف الثالث الإعدادي</option>
            <option value="sec1">الصف الأول الثانوي</option>
            <option value="sec2">الصف الثاني الثانوي</option>
            <option value="sec3">الصف الثالث الثانوي</option>
        </select>
    </div>

    <div class="container" id="booksList">
        <!-- الكتب ستعرض هنا تلقائياً -->
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © كتب مصرية 2026</p>
    </footer>

    <script>
        const allBooks = [
            // الإعدادية
            { title: "كتاب اللغة العربية", stage: "prep1", stageName: "الصف الأول الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب العلوم", stage: "prep1", stageName: "الصف الأول الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب الرياضيات", stage: "prep1", stageName: "الصف الأول الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب الدراسات الاجتماعية", stage: "prep1", stageName: "الصف الأول الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب اللغة الإنجليزية", stage: "prep1", stageName: "الصف الأول الإعدادي", url: "https://moe.gov.eg" },

            { title: "كتاب اللغة العربية", stage: "prep2", stageName: "الصف الثاني الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب العلوم", stage: "prep2", stageName: "الصف الثاني الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب الرياضيات", stage: "prep2", stageName: "الصف الثاني الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب الدراسات الاجتماعية", stage: "prep2", stageName: "الصف الثاني الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب اللغة الإنجليزية", stage: "prep2", stageName: "الصف الثاني الإعدادي", url: "https://moe.gov.eg" },

            { title: "كتاب اللغة العربية", stage: "prep3", stageName: "الصف الثالث الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب العلوم", stage: "prep3", stageName: "الصف الثالث الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب الرياضيات", stage: "prep3", stageName: "الصف الثالث الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب الدراسات الاجتماعية", stage: "prep3", stageName: "الصف الثالث الإعدادي", url: "https://moe.gov.eg" },
            { title: "كتاب اللغة الإنجليزية", stage: "prep3", stageName: "الصف الثالث الإعدادي", url: "https://moe.gov.eg" },

            // الثانوية
            { title: "كتاب اللغة العربية", stage: "sec1", stageName: "الصف الأول الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الرياضيات المدمجة", stage: "sec1", stageName: "الصف الأول الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب العلوم المتكاملة", stage: "sec1", stageName: "الصف الأول الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب التاريخ والجمال", stage: "sec1", stageName: "الصف الأول الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب اللغة الإنجليزية", stage: "sec1", stageName: "الصف الأول الثانوي", url: "https://moe.gov.eg" },

            { title: "كتاب اللغة العربية", stage: "sec2", stageName: "الصف الثاني الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الرياضيات التطبيقية", stage: "sec2", stageName: "الصف الثاني الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الفيزياء", stage: "sec2", stageName: "الصف الثاني الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الكيمياء", stage: "sec2", stageName: "الصف الثاني الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الأحياء", stage: "sec2", stageName: "الصف الثاني الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب اللغة الإنجليزية", stage: "sec2", stageName: "الصف الثاني الثانوي", url: "https://moe.gov.eg" },

            { title: "كتاب اللغة العربية", stage: "sec3", stageName: "الصف الثالث الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الفيزياء للثانوية العامة", stage: "sec3", stageName: "الصف الثالث الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الكيمياء للثانوية العامة", stage: "sec3", stageName: "الصف الثالث الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الأحياء والجيولوجيا", stage: "sec3", stageName: "الصف الثالث الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب الرياضيات البحتة", stage: "sec3", stageName: "الصف الثالث الثانوي", url: "https://moe.gov.eg" },
            { title: "كتاب اللغة الإنجليزية", stage: "sec3", stageName: "الصف الثالث الثانوي", url: "https://moe.gov.eg" }
        ];

        function displayBooks(books) {
            const container = document.getElementById('booksList');
            container.innerHTML = '';
            
            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div>
                        <h3>${book.title}</h3>
                        <p>${book.stageName}</p>
                    </div>
                    <a href="${book.url}" class="download-btn" target="_blank">تحميل PDF</a>
                `;
                container.appendChild(card);
            });
        }

        function filterBooks() {
            const selectedStage = document.getElementById('stageFilter').value;
            if (selectedStage === 'all') {
                displayBooks(allBooks);
            } else {
                const filtered = allBooks.filter(b => b.stage === selectedStage);
                displayBooks(filtered);
            }
        }

        // تشغيل العرض الأولي
        displayBooks(allBooks);
    </script>
</body>
</html>
